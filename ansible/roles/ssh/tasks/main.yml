---
- name: Create devops user
  ansible.builtin.user:
    name: devops
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
- name: Create devops .ssh directory
  ansible.builtin.file:
    path: /home/devops/.ssh
    state: directory
    owner: devops
    group: devops
    mode: "0700"
- name: Install devops public key
  ansible.builtin.authorized_key:
    user: devops
    key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/devops_vm.pub') }}"
    manage_dir: false
- name: Grant devops passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/devops
    content: "devops ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
- name: Harden OpenSSH server
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      PermitEmptyPasswords no
      AllowUsers student devops
      X11Forwarding no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -T -f %s
  notify: Restart SSH
- name: Allow SSH and HTTP through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
- name: Set UFW default policies and enable
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - {direction: incoming, policy: deny}
    - {direction: outgoing, policy: allow}
- name: Enable UFW with low logging
  community.general.ufw:
    state: enabled
    logging: low
