---
# Образ публикуется мультиарх (amd64/arm64) в GHCR — VM на ARM64 иначе не запускает amd64-образ.
# app_tag "latest" — дефолт для ручных запусков; CI переопределяет точным SHA через -e app_tag=$GITHUB_SHA.
app_image: "ghcr.io/slopslopus/devops-ci-app"
app_tag: "latest"
app_container_name: "devops-ci-app"
app_host_port: 5000
app_internal_port: 5000
